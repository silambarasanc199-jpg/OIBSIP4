<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXCALC | Futuristic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-wrapper">

        <section class="calculator" aria-label="Calculator">

            <div class="calculator-header">
                <div>
                    <p class="brand">NEXCALC</p>
                    <p class="subtitle">PRECISION CALCULATOR</p>
                </div>

                <div class="status">
                    <span></span> ONLINE
                </div>
            </div>

            <div class="display-area">
                <div id="history" class="history"></div>
                <input
                    type="text"
                    id="display"
                    class="display"
                    value="0"
                    readonly
                    aria-label="Calculator display"
                >
            </div>

            <div class="keypad">

                <button class="function" data-action="clear">AC</button>
                <button class="function" data-action="delete">DEL</button>
                <button class="operator" data-value="%">%</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="+">+</button>

                <button data-value="0" class="zero">0</button>
                <button data-value=".">.</button>
                <button class="equals" data-action="calculate">=</button>

            </div>

        </section>

        <p class="footer-text">
            NEXCALC • WEB DEVELOPMENT LEVEL 1
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
